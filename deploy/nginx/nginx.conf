worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    # 2026-07-13 审核流：资源上传上限 200MB（Spring multipart 200MB/210MB 同步）
    client_max_body_size 210m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ===== HTTP → HTTPS 强制跳转（裸域名 server）=====
    server {
        listen 80;
        server_name qingyunsq.top www.qingyunsq.top;
        return 301 https://www.qingyunsq.top$request_uri;
    }

    # ===== HTTPS：qingyunsq.top → www.qingyunsq.top 301（裸域名）=====
    server {
        listen 443 ssl;
        server_name qingyunsq.top;

        ssl_certificate     /etc/nginx/ssl/qingyunsq.top.pem;
        ssl_certificate_key /etc/nginx/ssl/qingyunsq.top.key;

        # 现代 SSL 配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # 301 永久重定向到 www.qingyunsq.top
        return 301 https://www.qingyunsq.top$request_uri;
    }

    # ===== HTTPS 主站：www.qingyunsq.top =====
    server {
        listen 443 ssl;
        server_name www.qingyunsq.top;

        ssl_certificate     /etc/nginx/ssl/qingyunsq.top.pem;
        ssl_certificate_key /etc/nginx/ssl/qingyunsq.top.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # ===== 安全响应头 =====
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

        # ===== 屏蔽 actuator =====
        location = /actuator/prometheus {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://app:8080/actuator/prometheus;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/actuator/ {
            return 404;
        }

        # ===== 屏蔽 Knife4j / OpenAPI 文档路径 =====
        location ~ ^/(swagger-ui|v3/api-docs|swagger-resources|doc\.html|webjars)/ {
            return 404;
        }

        # 拦截公网扫描
        location ~ /\.(?!well-known) {
            return 404;
        }

        location ~* ^/(version|containers/json|SDK/webLanguage)$ {
            return 404;
        }

        # PDF / image preview
        location ~ ^/api/v1/resources/[0-9]+/preview$ {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        }

        # 旧产品入口迁移
        location = /square {
            return 302 /resources;
        }

        location ^~ /square/ {
            return 302 /resources;
        }

        location = /spaces {
            return 302 /learning;
        }

        # 注意：/spaces/{id}（空间详情）与 /checkin*（打卡）是活跃 SPA 路由，
        # 不做重定向，交给下方 try_files 兜底（2026-07-12 移除误劫持的 302 规则）

        # 前端静态资源
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # API 反代
        location /api/ {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
